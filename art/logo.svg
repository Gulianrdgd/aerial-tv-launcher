<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Aerial</title>
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="116"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1030"/>
      <stop offset="0.55" stop-color="#2A2560"/>
      <stop offset="1" stop-color="#5B3F86"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.62" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#FFB37A" stop-opacity="0.85"/>
      <stop offset="0.35" stop-color="#E8738F" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5B3F86" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="earth" gradientUnits="userSpaceOnUse" cx="344" cy="300" r="330">
      <stop offset="0" stop-color="#2B4F9A"/>
      <stop offset="0.35" stop-color="#16285C"/>
      <stop offset="1" stop-color="#070C24"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6E8FE0" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#7FA8FF" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#FFC48A"/>
      <stop offset="0.8" stop-color="#FF8FA3"/>
      <stop offset="1" stop-color="#7FB2FF" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.25" stop-color="#FFF1D6"/>
      <stop offset="0.6" stop-color="#FFC07A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF9A6A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <rect width="512" height="512" fill="url(#glow)"/>

    <!-- stars -->
    <g fill="#FFFFFF">
      <circle cx="92" cy="88" r="2.6" opacity="0.9"/>
      <circle cx="170" cy="150" r="1.8" opacity="0.6"/>
      <circle cx="388" cy="72" r="2.2" opacity="0.8"/>
      <circle cx="440" cy="168" r="1.6" opacity="0.5"/>
      <circle cx="262" cy="104" r="1.5" opacity="0.5"/>
      <circle cx="58" cy="214" r="1.5" opacity="0.45"/>
    </g>

    <!-- Earth seen from orbit: a huge circle, only its top arc in frame -->
    <circle cx="200" cy="1010" r="720" fill="url(#earth)"/>
    <!-- city lights on the night side -->
    <g fill="#FFD7A0">
      <circle cx="92" cy="372" r="2.4" opacity="0.8"/><circle cx="104" cy="380" r="1.5" opacity="0.6"/>
      <circle cx="148" cy="360" r="1.8" opacity="0.7"/><circle cx="62" cy="410" r="1.6" opacity="0.5"/>
      <circle cx="132" cy="418" r="2.6" opacity="0.75"/><circle cx="144" cy="424" r="1.5" opacity="0.55"/>
      <circle cx="196" cy="398" r="1.8" opacity="0.6"/><circle cx="84" cy="466" r="2" opacity="0.5"/>
      <circle cx="226" cy="452" r="1.5" opacity="0.45"/><circle cx="170" cy="476" r="2.2" opacity="0.55"/>
    </g>
    <!-- atmosphere along the rim -->
    <circle cx="200" cy="1010" r="722" fill="none" stroke="url(#rim)" stroke-width="10" opacity="0.9"/>
    <circle cx="200" cy="1010" r="736" fill="none" stroke="#FFB48A" stroke-width="22" opacity="0.12"/>

    <!-- the sun breaking over the horizon -->
    <circle cx="344" cy="300" r="104" fill="url(#sun)"/>
    <circle cx="344" cy="300" r="16" fill="#FFFFFF"/>
  </g>
</svg>
