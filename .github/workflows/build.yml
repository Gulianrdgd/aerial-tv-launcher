name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest

      # Releases are signed with the key in the KEYSTORE_BASE64 secret, so they
      # install over earlier versions. Without the secret, tags only build.
      - name: Release APK
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          ./gradlew :app:assembleRelease -PciKeystore="$RUNNER_TEMP/release.keystore"
          cp app/build/outputs/apk/release/app-release.apk "aerial-${GITHUB_REF_NAME#v}.apk"
          # The same file under a fixed name, so releases/latest/download/aerial.apk always works.
          cp app/build/outputs/apk/release/app-release.apk aerial.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See the changelog."
          gh release upload "$GITHUB_REF_NAME" aerial*.apk --clobber
